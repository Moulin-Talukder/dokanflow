packages:
  - apps/*
  - packages/*

# Refuse to install on a Node version outside package.json "engines" (the API needs
# node:crypto argon2, added in Node 24.7; the Nest CLI needs 24.15+).
engineStrict: true

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

# Versions shared by several workspace packages. Reference with "catalog:".
catalog:
  '@types/node': ^24.19.2
  typescript: ~6.0.3
  vitest: ^5.1.0
  zod: ^4.6.7
